<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VZ // RECOVERY TERMINAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;700&display=swap');
        
        :root {
            --bg: #000000;
            --bg-dark: #050505;
            --text: #d0d0d0;
            --text-dim: #707070;
            --text-faint: #404040;
            --accent: #8b0000;
            --accent-bright: #ff2020;
            --neon: #ff3030;
            --orange: #cc6600;
            --gold: #c8a000;
            --border: #1a1a1a;
            --font-term: 'VT323', 'Courier New', monospace;
            --font-main: 'IBM Plex Mono', 'Courier New', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        *:focus {
            outline: none !important;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            cursor: none;
        }
        
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(255,48,48,0.7), 0 0 30px rgba(255,48,48,0.3);
            animation: cursorPulse 1.5s infinite;
            transition: transform 0.1s;
        }
        
        .custom-cursor.clicked {
            transform: scale(0.7);
        }
        
        @keyframes cursorPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255,48,48,0.7), 0 0 30px rgba(255,48,48,0.3); }
            50% { box-shadow: 0 0 25px rgba(255,48,48,1), 0 0 50px rgba(255,48,48,0.5); }
        }
        
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.04) 0px,
                rgba(0,0,0,0.04) 1px,
                transparent 1px,
                transparent 3px
            );
            animation: noiseShift 0.5s infinite;
        }
        
        @keyframes noiseShift {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }
        
        .glow-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(139,0,0,0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 3s infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        .terminal-wrapper {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 850px;
            height: 88vh;
            margin: 6vh auto;
            background: rgba(5,5,5,0.98);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 
                0 0 60px rgba(139,0,0,0.25),
                inset 0 0 60px rgba(139,0,0,0.05);
        }
        
        .terminal-wrapper::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border: 1px solid rgba(139,0,0,0.3);
            pointer-events: none;
            animation: borderGlow 3s infinite;
        }
        
        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #0a0a0a;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .terminal-title {
            font-family: var(--font-term);
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--text-dim);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,48,48,0.3);
        }
        
        .terminal-status {
            font-family: var(--font-term);
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--neon);
            animation: statusBlink 2s infinite;
        }
        
        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .terminal-output {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: var(--font-term);
            font-size: 1.15rem;
            letter-spacing: 1.5px;
            line-height: 1.6;
            min-height: 0;
            scroll-behavior: smooth;
        }
        
        .line {
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .line.green {
            color: #00cc00;
            text-shadow: 0 0 8px rgba(0,204,0,0.5);
        }
        
        .line.red {
            color: var(--accent-bright);
            text-shadow: 0 0 12px rgba(255,32,32,0.6);
        }
        
        .line.orange {
            color: var(--orange);
            text-shadow: 0 0 10px rgba(204,102,0,0.5);
        }
        
        .line.gold {
            color: var(--gold);
            text-shadow: 0 0 15px rgba(200,160,0,0.6);
        }
        
        .line.dim {
            color: var(--text-dim);
        }
        
        .line.faint {
            color: var(--text-faint);
        }
        
        .line.system {
            color: var(--text-dim);
        }
        
        .line.glitch-text {
            animation: textGlitch 2s infinite;
        }
        
        @keyframes textGlitch {
            0%, 92%, 100% { transform: translateX(0); opacity: 1; }
            93% { transform: translateX(-2px); opacity: 0.5; }
            95% { transform: translateX(2px); opacity: 1; }
            97% { transform: translateX(-1px); opacity: 0.7; }
        }
        
        .line.big-reveal {
            font-size: 1.8rem;
            letter-spacing: 5px;
            text-align: center;
            padding: 20px;
            text-transform: uppercase;
            animation: revealGlow 2s infinite;
        }
        
        @keyframes revealGlow {
            0%, 100% { text-shadow: 0 0 15px rgba(255,48,48,0.5); }
            50% { text-shadow: 0 0 40px rgba(255,48,48,1); }
        }
        
        .cursor-block {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: var(--neon);
            animation: cursorBlink 0.8s infinite;
            vertical-align: middle;
            box-shadow: 0 0 10px rgba(255,48,48,0.8);
        }
        
        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .morse-indicator {
            position: fixed;
            bottom: 15px;
            right: 25px;
            font-family: var(--font-term);
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: var(--text-faint);
            z-index: 10;
            animation: morseFade 3s infinite;
        }
        
        @keyframes morseFade {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        ::-webkit-scrollbar {
            width: 3px;
        }
        
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
        }
        
        @media (max-width: 768px) {
            .terminal-output {
                font-size: 0.9rem;
                padding: 15px;
            }
            
            .terminal-wrapper {
                height: 95vh;
                margin: 2.5vh auto;
                width: 95%;
            }
            
            .line.big-reveal {
                font-size: 1.3rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body class="login-body">
    <div class="custom-cursor" id="customCursor"></div>
    <div class="noise-overlay"></div>
    <div class="glow-overlay"></div>
    
    <div class="terminal-wrapper">
        <div class="terminal-header">
            <span class="terminal-title">VZ // RECOVERY TERMINAL v.81</span>
            <span class="terminal-status">● REC</span>
        </div>
        
        <div class="terminal-output" id="terminal"></div>
    </div>
    
    <div class="morse-indicator">... --- ...</div>
    
    <script>
        (function() {
            const terminal = document.getElementById('terminal');
            const cursor = document.getElementById('customCursor');
            let speed = 20;
            
            // ============ АУДИО ============
            let audioCtx = null;
            let master = null;
            let drone = null;
            let droneGain = null;
            
            function initAudio() {
                if (audioCtx) return;
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                master = audioCtx.createGain();
                master.gain.value = 0.12;
                master.connect(audioCtx.destination);
                
                // Низкий гул
                drone = audioCtx.createOscillator();
                droneGain = audioCtx.createGain();
                drone.type = 'sine';
                drone.frequency.value = 47;
                droneGain.gain.value = 0.35;
                drone.connect(droneGain);
                droneGain.connect(master);
                drone.start();
                
                // Второй слой
                const sub = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                sub.type = 'triangle';
                sub.frequency.value = 91;
                subGain.gain.value = 0.08;
                sub.connect(subGain);
                subGain.connect(master);
                sub.start();
                
                // Шум кассеты
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * 0.15;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.04;
                noise.connect(noiseGain);
                noiseGain.connect(master);
                noise.start();
                
                // Случайные ошибки
                setInterval(() => {
                    if (Math.random() > 0.55) {
                        systemGlitch();
                    }
                }, 4000);
                
                setInterval(() => {
                    if (Math.random() > 0.5) {
                        diskNoise();
                    }
                }, 3000);
            }
            
            function systemGlitch() {
                if (!audioCtx || !master) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = 300 + Math.random() * 700;
                gain.gain.value = 0.025;
                osc.connect(gain);
                gain.connect(master);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05 + Math.random() * 0.15);
            }
            
            function diskNoise() {
                if (!audioCtx || !master) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = 80;
                gain.gain.value = 0.03;
                osc.connect(gain);
                gain.connect(master);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            }
            
            function dropDrone() {
                if (!drone || !droneGain || !audioCtx) return;
                drone.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 2);
            }
            
            function restoreDrone() {
                if (!drone || !droneGain || !audioCtx) return;
                drone.frequency.exponentialRampToValueAtTime(47, audioCtx.currentTime + 3);
            }
            
            document.addEventListener('click', function() {
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }, { once: true });
            
            // ============ КУРСОР ============
            document.addEventListener('mousemove', function(e) {
                cursor.style.left = (e.clientX - 10) + 'px';
                cursor.style.top = (e.clientY - 10) + 'px';
            });
            
            document.addEventListener('mousedown', function() {
                cursor.classList.add('clicked');
            });
            
            document.addEventListener('mouseup', function() {
                cursor.classList.remove('clicked');
            });
            
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
            
            async function write(text, cls = '') {
                const span = document.createElement('span');
                span.className = 'line ' + cls;
                terminal.appendChild(span);
                
                for (let char of text) {
                    span.textContent += char;
                    if (char !== ' ' && Math.random() < 0.02) {
                        span.textContent = span.textContent.slice(0, -1) + '█';
                        await sleep(15);
                        span.textContent = span.textContent.slice(0, -1) + char;
                    }
                    await sleep(speed + Math.random() * 15);
                }
                
                autoScroll();
            }
            
            function addBlank() {
                const el = document.createElement('div');
                el.className = 'line';
                el.textContent = ' ';
                terminal.appendChild(el);
                autoScroll();
            }
            
            function autoScroll() {
                terminal.scrollTop = terminal.scrollHeight;
            }
            
            function updateMorse() {
                const morseEl = document.querySelector('.morse-indicator');
                const signals = ['... --- ...', '-...- . ...--', '... --- ...  -...- . ...--'];
                let i = 0;
                setInterval(() => {
                    morseEl.textContent = signals[i % signals.length];
                    i++;
                }, 4000);
            }
            
            async function boot() {
                await sleep(300);
                await write('VZ BOOT SEQUENCE v4.51PG', 'system');
                await sleep(200);
                await write('SYSTEM INITIALIZED // 2026', 'system');
                await write('CPU : VZ CORE(TM) @ 4.70 GHz', 'system');
                await write('MEMORY TEST : 65536KB OK', 'green');
                await sleep(500);
                
                addBlank();
                await write('Checking storage devices...', 'dim');
                await write('PRIMARY DRIVE ........ FAILED', 'red');
                await write('SECONDARY DRIVE ...... FAILED', 'red');
                await sleep(500);
                
                addBlank();
                await write('RECOVERY PARTITION FOUND', 'green');
                await sleep(700);
                
                addBlank();
                await write('MOUNTING UNKNOWN DATA...', 'dim');
                await sleep(1000);
                
                addBlank();
                systemGlitch();
                await write('SYSTEM FAILURE', 'red');
                await write('NO OPERATING SYSTEM FOUND', 'red');
                await sleep(1000);
                
                addBlank();
                await write('Attempting emergency recovery...', 'orange');
                await sleep(800);
                
                addBlank();
                await write('SEARCHING AVAILABLE ARCHIVES...', 'dim');
                await sleep(1000);
                
                addBlank();
                await write('ARCHIVE_01 ......... CORRUPTED', 'faint');
                await write('ARCHIVE_02 ......... EMPTY', 'faint');
                await write('ARCHIVE_03 ......... UNKNOWN', 'faint');
                await sleep(1000);
                
                addBlank();
                addBlank();
                dropDrone();
                await write('ONE ARCHIVE REMAINS.', 'gold big-reveal');
                await sleep(1000);
                restoreDrone();
                
                addBlank();
                await write('THE SYSTEM DOES NOT REMEMBER IT.', 'orange');
                await sleep(500);
                dropDrone();
                await write('ANOTHER ARCHIVE DOES.', 'red big-reveal');
                await sleep(1500);
                restoreDrone();
                
                addBlank();
                await write('RECOVERING METADATA...', 'dim');
                await sleep(1500);
                
                addBlank();
                await write('NAME: [REDACTED]', 'red');
                await write('DATE CREATED: 18.06.2024', 'system');
                await write('LAST MODIFIED: 01.08.2024', 'system');
                await write('STATUS: LOCKED', 'red');
                await sleep(1200);
                
                addBlank();
                await write('ACCESS ATTEMPT REQUIRED', 'orange');
                await sleep(1000);
                
                addBlank();
                await write('PASSWORD INPUT DISABLED', 'red');
                await write('REASON: WRITE FAILURE', 'red');
                await sleep(1500);
                
                addBlank();
                await write('REDIRECTING TO ARCHIVE LOCATION...', 'green');
                await sleep(2500);
                
                addBlank();
                await write('... --- ...  -...- . ...--', 'faint');
                await sleep(1500);
                
                window.location.href = 'https://ryker-netizen.github.io/VZ_CASE-81/index.html';
            }
            
            updateMorse();
            boot();
        })();
    </script>
</body>
</html>
